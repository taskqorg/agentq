# agentq.md § 5 Release: one binary per OS and arch, SHA256SUMS, latest.json, build provenance attestations. A failing selftest publishes nothing.
# Pull requests run every step except Attest and Publish.
name: release
on:
  push:
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        include:
          - hosted: '"macos-latest"'
            local: '["self-hosted", "macOS", "ARM64", "taskq-mac"]'
            triple: aarch64-apple-darwin
            target: macos-aarch64
          - hosted: '"windows-latest"'
            local: '["self-hosted", "Windows", "X64", "agentq-win"]'
            triple: x86_64-pc-windows-msvc
            target: windows-x86_64
            ext: .exe
          - hosted: '"ubuntu-latest"'
            local: '["self-hosted", "Linux", "X64", "agentq-wsl"]'
            triple: x86_64-unknown-linux-musl
            target: linux-x86_64
    # A release builds on our hosts; pull requests, forks included, stay on disposable GitHub runners.
    runs-on: ${{ fromJSON(github.event_name == 'push' && matrix.local || matrix.hosted) }}
    # The Windows host keeps its default PowerShell execution policy, which refuses the runner's script files.
    defaults:
      run:
        shell: bash
    env:
      AGENTQ_SELFTEST_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v6
      # The Mac runner's .env also serves tests.yml, which expects target/ in the workspace.
      - if: runner.environment == 'self-hosted' && runner.os == 'macOS'
        run: echo "CARGO_TARGET_DIR=$HOME/release-target" >> "$GITHUB_ENV"
      - run: rustup default stable && rustup target add ${{ matrix.triple }}
      - if: runner.os == 'Linux' && runner.environment == 'github-hosted'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Version from tag
        shell: bash
        run: |
          ver=0.0.0-dev
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            ver="${GITHUB_REF_NAME#v}"
            perl -pi -e 'if (!$d && s/^version = ".*"/version = "'"$ver"'"/) { $d = 1 }' Cargo.toml
          fi
          grep -q "^version = \"$ver\"" Cargo.toml
          echo "VER=$ver" >> "$GITHUB_ENV"
      - run: cargo test --target ${{ matrix.triple }}
      - run: cargo build --release --target ${{ matrix.triple }}
      - name: Selftest and stage
        shell: bash
        run: |
          bin="${CARGO_TARGET_DIR:-target}/${{ matrix.triple }}/release/agentq${{ matrix.ext }}"
          "$bin" selftest
          mkdir dist
          cp "$bin" "dist/agentq-$VER-${{ matrix.target }}${{ matrix.ext }}"
      # The script installs a real OS service, so it runs only on a disposable runner: each pull request.
      - name: Service lifecycle
        if: runner.environment == 'github-hosted'
        shell: bash
        run: scripts/service-lifecycle.sh "dist/agentq-$VER-${{ matrix.target }}${{ matrix.ext }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*
  describe:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Describe
        run: |
          ver=$(ls dist | sed -n 's/^agentq-\(.*\)-linux-x86_64$/\1/p')
          cd dist
          sha256sum agentq-* > SHA256SUMS
          python3 - "$ver" <<'PY'
          import json, os, sys
          ver = sys.argv[1]
          files = {}
          for name in sorted(os.listdir('.')):
              if name.startswith(f'agentq-{ver}-'):
                  files[name[len(f'agentq-{ver}-'):].removesuffix('.exe')] = name
          json.dump({'version': ver, 'files': files}, open('latest.json', 'w'), indent=1)
          status = json.load(open('../tests/fixtures/status.json'))
          status['version'] = ver
          json.dump(status, open('status.json', 'w'), indent=1)
          PY
          cat latest.json SHA256SUMS
      - name: Attest
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/agentq-*
            dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: dist/*
  publish:
    needs: describe
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes "agentq $GITHUB_REF_NAME"
