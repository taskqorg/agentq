# Diagnostic-only branch; never merge. No push/PR/release trigger or repository secrets.
name: ACP startup diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-startup:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      AGENTQ_SELFTEST_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: rustup default stable
      - name: Owned identity control and exact ACP fixture
        shell: python
        run: |
          import json, pathlib, subprocess, sys
          records = []
          for target, extra in [('identity-control', ['--lib', 'stale_snapshot_refuses_unrelated_process_before_touching_it', '--', '--nocapture']), ('acp-fixture', ['--test', 'acp'])]:
              result = subprocess.run(['cargo', 'test', '--locked', '-p', 'agentq-runtime', *extra], stdout=subprocess.PIPE, stderr=subprocess.STDOUT, encoding='utf-8', errors='replace')
              for line in result.stdout.splitlines():
                  prefix = 'JOBDIAG '
                  if prefix not in line:
                      continue
                  # Only structured numeric/boolean metadata from the native identity boundary.
                  record = json.loads(line.split(prefix, 1)[1])
                  assert isinstance(record.get('stage'), str)
                  assert all(value is None or type(value) in (int, bool) for key, value in record.items() if key != 'stage')
                  record['target'] = target
                  records.append(record)
                  print(prefix + json.dumps(record), flush=True)
              status = {'stage': 'test-exit', 'target': target, 'exit': result.returncode}
              records.append(status)
              print('JOBDIAG ' + json.dumps(status), flush=True)
              if result.returncode:
                  pathlib.Path('startup-metadata.jsonl').write_text('\n'.join(map(json.dumps, records)) + '\n')
                  sys.exit(result.returncode)
          pathlib.Path('startup-metadata.jsonl').write_text('\n'.join(map(json.dumps, records)) + '\n')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: startup-metadata
          path: startup-metadata.jsonl
          if-no-files-found: error
