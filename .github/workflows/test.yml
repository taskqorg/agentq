name: Test
on:
  # Branch work runs through pull_request and merge_group; main pushes keep the main status.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  merge_group:
permissions:
  contents: read
# A new push to a pull request replaces its older run.
concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: taskqorg/specq
          ref: 7e9adf57287553176d8b3be61c2b22565543dc51
          path: .specq
      - run: python3 .specq/engineering/scripts/contract_lint.py agentq.md
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    # GitHub-hosted runners are free for this public repository and run in parallel; the host Mac also runs the agents.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      AGENTQ_SELFTEST_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v6
      - run: rustup default stable
      # Only main pushes save the cache.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: python tests/hermes_adapter.py
      - run: python tests/pin_update.py
      - run: cargo test --locked
      - run: cargo run --locked -- selftest
