name: Test
on: [push, pull_request, workflow_dispatch, merge_group]
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: taskqorg/specq
          ref: 7e9adf57287553176d8b3be61c2b22565543dc51
          path: .specq
      - run: python3 .specq/engineering/scripts/contract_lint.py agentq.md
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      AGENTQ_SELFTEST_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v6
      - run: rustup default stable
      - run: python tests/client_compression_check.py
      - run: python tests/provider_adapter.py
      - run: python tests/hermes_adapter.py
      - run: python tests/telemetry_qualification.py
      - run: cargo test --locked
      - run: cargo run --locked -- selftest
