[package]
name = "agentq-runtime"
version = "0.7.0"
edition = "2024"
publish = false
description = "Codex, Claude and Antigravity worker runtime with optional AgentQ optimization (agentq.md § 12)"

[lib]
name = "agentq_runtime"
path = "src/lib.rs"

[dependencies]
coreq = { git = "https://github.com/taskqorg/coreq", tag = "v0.21.0" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
ring = "0.17"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[[test]]
name = "agent"
path = "tests/agent.rs"
# The binary is also the fake Claude and Codex client (COREQ_FAKE_AGENT), so it owns main.
harness = false
