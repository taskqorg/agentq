[package]
name = "agentq-runtime"
version = "0.15.0"
edition = "2024"
publish = false
description = "Shared native worker layer: prepare, launch, observe, control, history and archive (agentq.md §12)"

[lib]
name = "agentq_runtime"
path = "src/lib.rs"

[dependencies]
coreq = { git = "https://github.com/taskqorg/coreq", tag = "v0.23.4" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
ring = "0.17"
toml = { version = "=1.1.8", default-features = false, features = ["std", "parse", "serde"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry"] }

[[test]]
name = "agent"
path = "src/lib.rs"
# The binary is also the fake Claude and Codex client (COREQ_FAKE_AGENT), so it owns main.
harness = false

[[example]]
name = "qualify_events"
test = true
